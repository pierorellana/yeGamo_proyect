openapi: 3.1.0
info:
  title: yeGamo API
  version: 1.1.1
  description: >-
    Contrato REST/JSON versionado para planificación multimodal, movilidad
    cercana, viajes activos, rutinas, avisos y privacidad.
servers:
  - url: /v1
    description: API versionada; el host se configura por ambiente.
tags:
  - name: health
  - name: places
  - name: transit
  - name: journeys
  - name: active-journeys
  - name: favorites
  - name: commutes
  - name: notifications
  - name: identity
  - name: privacy
  - name: community
    description: Capacidades post-MVP, publicadas para compatibilidad contractual.
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Servicio disponible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /providers/status:
    get:
      tags: [health]
      operationId: getProviderStatus
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Salud de proveedores autorizados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProviderHealthSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /places/search:
    get:
      tags: [places]
      operationId: searchPlaces
      security: []
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/LatitudeOptional' }
        - { $ref: '#/components/parameters/LongitudeOptional' }
      responses:
        '200':
          description: Lugares encontrados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Place' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /places/reverse:
    get:
      tags: [places]
      operationId: reverseGeocode
      security: []
      parameters:
        - { $ref: '#/components/parameters/Latitude' }
        - { $ref: '#/components/parameters/Longitude' }
      responses:
        '200':
          description: Lugar resuelto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /transit/stops/nearby:
    get:
      tags: [transit]
      operationId: getNearbyStops
      security: []
      parameters:
        - { $ref: '#/components/parameters/Latitude' }
        - { $ref: '#/components/parameters/Longitude' }
        - { $ref: '#/components/parameters/RadiusM' }
      responses:
        '200':
          description: Paradas cercanas con estado de datos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TransitStop' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /transit/stops/{stopId}/departures:
    get:
      tags: [transit]
      operationId: getStopDepartures
      security: []
      parameters: [{ $ref: '#/components/parameters/StopId' }]
      responses:
        '200':
          description: Salidas estimadas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Departure' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /transit/routes/{routeId}:
    get:
      tags: [transit]
      operationId: getTransitRoute
      security: []
      parameters: [{ $ref: '#/components/parameters/RouteId' }]
      responses:
        '200':
          description: Ruta canónica.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitRoute' }
        '404': { $ref: '#/components/responses/NotFound' }
  /journeys/plan:
    post:
      tags: [journeys]
      operationId: planJourney
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyOptional' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JourneyPlanRequest' }
            examples:
              guayaquil:
                externalValue: ./examples/journey-plan-request.json
      responses:
        '200':
          description: Plan y alternativas ordenadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyPlanResponse' }
              examples:
                guayaquil:
                  externalValue: ./examples/journey-plan-response.json
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /journeys/{planId}:
    get:
      tags: [journeys]
      operationId: getJourneyPlan
      security: []
      parameters: [{ $ref: '#/components/parameters/PlanId' }]
      responses:
        '200':
          description: Plan de viaje.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyPlanResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /journeys/{planId}/options/{optionId}/start:
    post:
      tags: [journeys]
      operationId: startJourney
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/OptionId' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      responses:
        '201':
          description: Viaje activo creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveJourney' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /active-journeys/{id}:
    get:
      tags: [active-journeys]
      operationId: getActiveJourney
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: Viaje activo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveJourney' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /active-journeys/{id}/progress:
    patch:
      tags: [active-journeys]
      operationId: updateActiveJourneyProgress
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JourneyProgressRequest' }
      responses:
        '200':
          description: Progreso actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveJourney' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /active-journeys/{id}/finish:
    post:
      tags: [active-journeys]
      operationId: finishActiveJourney
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      responses:
        '200':
          description: Viaje finalizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveJourney' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /active-journeys/{id}/cancel:
    post:
      tags: [active-journeys]
      operationId: cancelActiveJourney
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      responses:
        '200':
          description: Viaje cancelado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveJourney' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /favorites/places:
    get:
      tags: [favorites]
      operationId: listFavoritePlaces
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lugares guardados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Place' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [favorites]
      operationId: createFavoritePlace
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceInput' }
      responses:
        '201':
          description: Lugar guardado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /favorites/places/{id}:
    patch:
      tags: [favorites]
      operationId: updateFavoritePlace
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceInput' }
      responses:
        '200':
          description: Lugar actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [favorites]
      operationId: deleteFavoritePlace
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '204': { description: Lugar eliminado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /commute-profiles:
    get:
      tags: [commutes]
      operationId: listCommuteProfiles
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Rutinas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommuteProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [commutes]
      operationId: createCommuteProfile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommuteProfileInput' }
      responses:
        '201':
          description: Rutina creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommuteProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /commute-profiles/{id}:
    patch:
      tags: [commutes]
      operationId: updateCommuteProfile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommuteProfileInput' }
      responses:
        '200':
          description: Rutina actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommuteProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [commutes]
      operationId: deleteCommuteProfile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '204': { description: Rutina eliminada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /commute-profiles/{id}/pause:
    post:
      tags: [commutes]
      operationId: pauseCommuteProfile
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      responses:
        '200':
          description: Rutina pausada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommuteProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /commute-profiles/{id}/resume:
    post:
      tags: [commutes]
      operationId: resumeCommuteProfile
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      responses:
        '200':
          description: Rutina reanudada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommuteProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /alerts/leave:
    post:
      tags: [notifications]
      operationId: createLeaveAlert
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveAlertInput' }
      responses:
        '201':
          description: Aviso creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /alerts/{id}:
    delete:
      tags: [notifications]
      operationId: deleteLeaveAlert
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '204': { description: Aviso eliminado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Centro de avisos paginado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedNotifications' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{id}/read:
    patch:
      tags: [notifications]
      operationId: markNotificationRead
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200':
          description: Aviso actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Avisos actualizados. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [privacy]
      operationId: deleteCurrentUser
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      responses:
        '202': { description: Eliminación de cuenta aceptada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/guest-migration:
    post:
      tags: [identity]
      operationId: migrateGuestData
      description: Operación explícita, idempotente, transaccional y auditable.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestMigrationRequest' }
      responses:
        '200':
          description: Resultado de migración.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestMigrationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/devices:
    post:
      tags: [identity]
      operationId: registerDevice
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInstallationInput' }
      responses:
        '201':
          description: Instalación registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceInstallation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/devices/{id}:
    delete:
      tags: [identity]
      operationId: revokeDevice
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '204': { description: Instalación revocada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/preferences:
    get:
      tags: [identity]
      operationId: getPreferences
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Preferencias.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [identity]
      operationId: updatePreferences
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferences' }
      responses:
        '200':
          description: Preferencias actualizadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/data-export:
    post:
      tags: [privacy]
      operationId: requestDataExport
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      responses:
        '202':
          description: Exportación encolada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExportRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reports:
    post:
      tags: [community]
      operationId: createCommunityReport
      description: Capacidad post-MVP mantenida para compatibilidad contractual.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityReportInput' }
      responses:
        '201':
          description: Reporte creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reports/nearby:
    get:
      tags: [community]
      operationId: getNearbyReports
      security: []
      parameters:
        - { $ref: '#/components/parameters/Latitude' }
        - { $ref: '#/components/parameters/Longitude' }
      responses:
        '200':
          description: Reportes cercanos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommunityReport' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reports/{id}/confirm:
    post:
      tags: [community]
      operationId: confirmCommunityReport
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '204': { description: Confirmación registrada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/{id}/resolve:
    post:
      tags: [community]
      operationId: resolveCommunityReport
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '204': { description: Reporte resuelto. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT validado contra el proveedor OIDC configurado por ambiente.
  parameters:
    Query:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 2, maxLength: 160 }
    Latitude:
      name: lat
      in: query
      required: true
      schema: { type: number, minimum: -90, maximum: 90 }
    Longitude:
      name: lon
      in: query
      required: true
      schema: { type: number, minimum: -180, maximum: 180 }
    LatitudeOptional:
      name: lat
      in: query
      required: false
      schema: { type: number, minimum: -90, maximum: 90 }
    LongitudeOptional:
      name: lon
      in: query
      required: false
      schema: { type: number, minimum: -180, maximum: 180 }
    RadiusM:
      name: radiusM
      in: query
      required: false
      schema: { type: integer, minimum: 50, maximum: 3000, default: 800 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StopId:
      name: stopId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RouteId:
      name: routeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OptionId:
      name: optionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave estable por operación para hacer seguros los reintentos.
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    BadRequest:
      description: Solicitud malformada.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Falta autenticación válida.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: El principal no tiene permiso para la operación.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso no encontrado.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicto de estado o de idempotencia.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Solicitud que no cumple el contrato o una regla de dominio.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Demasiadas solicitudes.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProviderUnavailable:
      description: Proveedor no disponible o sin datos autorizados.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  headers:
    TraceId:
      description: Identificador de correlación de la solicitud.
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    GeoPoint:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90, example: -2.170997 }
        lon: { type: number, minimum: -180, maximum: 180, example: -79.922359 }
    DataState:
      type: string
      enum: [CURRENT, STALE, DEGRADED, OFFLINE_CACHE, UNAVAILABLE]
    Freshness:
      type: string
      enum: [CURRENT, STALE, UNKNOWN]
    HealthResponse:
      type: object
      required: [status, version, traceId]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string, example: 1.1.1 }
        traceId: { type: string, example: health-7c7c8d }
    Place:
      type: object
      required: [id, label, location]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, example: Centro de Guayaquil }
        location: { $ref: '#/components/schemas/GeoPoint' }
        source: { type: string, nullable: true, example: null }
    PlaceInput:
      type: object
      additionalProperties: false
      required: [label, location]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        location: { $ref: '#/components/schemas/GeoPoint' }
    TransitAgency:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Operador autorizado de Guayaquil }
        url: { type: string, format: uri, nullable: true }
        timezone: { type: string, example: America/Guayaquil }
    TransitRoute:
      type: object
      required: [id, shortName, agency]
      properties:
        id: { type: string, format: uuid }
        shortName: { type: string, example: R-12 }
        longName: { type: string, nullable: true }
        agency: { $ref: '#/components/schemas/TransitAgency' }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', nullable: true }
        dataState: { $ref: '#/components/schemas/DataState' }
    TransitStop:
      type: object
      required: [id, name, location, dataState]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Parada Centro }
        location: { $ref: '#/components/schemas/GeoPoint' }
        distanceM: { type: number, minimum: 0, example: 420 }
        dataState: { $ref: '#/components/schemas/DataState' }
    ETAEstimate:
      type: object
      required: [window, dataState, liveVehicle]
      properties:
        window: { $ref: '#/components/schemas/TimeWindow' }
        dataState: { $ref: '#/components/schemas/DataState' }
        liveVehicle: { type: boolean }
        observedAt: { type: string, format: date-time, nullable: true }
    Departure:
      type: object
      required: [routeId, estimate, dataState]
      properties:
        routeId: { type: string, format: uuid }
        estimate: { $ref: '#/components/schemas/ETAEstimate' }
        dataState: { $ref: '#/components/schemas/DataState' }
        stopId: { type: string, format: uuid }
    JourneyPlanRequest:
      type: object
      additionalProperties: false
      required: [origin, destination, timeMode]
      properties:
        origin: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/GeoPoint' }
        timeMode: { type: string, enum: [LEAVE_NOW, DEPART_AT, ARRIVE_BY] }
        time: { type: string, format: date-time, nullable: true }
        preference:
          type: string
          enum: [BALANCED, FASTEST, LESS_WALKING, FEWER_TRANSFERS, RELIABLE]
          default: BALANCED
        maxWalkMin: { type: integer, minimum: 1, maximum: 60, default: 12 }
        extraSafetyMarginMin: { type: integer, minimum: 0, maximum: 60, default: 0 }
      allOf:
        - if:
            required: [timeMode]
            properties:
              timeMode: { enum: [DEPART_AT, ARRIVE_BY] }
          then:
            required: [time]
    JourneyPlanResponse:
      type: object
      required: [planId, dataState, options]
      properties:
        planId: { type: string, format: uuid }
        recommendedLeaveAt: { type: string, format: date-time, nullable: true }
        arrivalWindow: { $ref: '#/components/schemas/TimeWindow' }
        dataState: { $ref: '#/components/schemas/DataState' }
        options:
          type: array
          items: { $ref: '#/components/schemas/JourneyOption' }
    TimeWindow:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    JourneyOption:
      type: object
      required: [id, durationMin, walkMin, transfers, reliability, dataQuality, legs]
      properties:
        id: { type: string, format: uuid }
        durationMin: { type: integer, minimum: 0 }
        walkMin: { type: integer, minimum: 0 }
        transfers: { type: integer, minimum: 0 }
        reliability: { $ref: '#/components/schemas/Reliability' }
        dataQuality: { $ref: '#/components/schemas/DataQuality' }
        legs:
          type: array
          items: { $ref: '#/components/schemas/JourneyLeg' }
    JourneyLeg:
      type: object
      required: [mode, from, to, durationMin]
      properties:
        mode: { type: string, enum: [WALK, TRANSIT] }
        from: { $ref: '#/components/schemas/GeoPoint' }
        to: { $ref: '#/components/schemas/GeoPoint' }
        durationMin: { type: integer, minimum: 0 }
        departureAt: { type: string, format: date-time, nullable: true }
        arrivalAt: { type: string, format: date-time, nullable: true }
        routeId: { type: string, format: uuid, nullable: true }
        fromStopId: { type: string, format: uuid, nullable: true }
        toStopId: { type: string, format: uuid, nullable: true }
        instructions:
          type: array
          items: { type: string }
    Reliability:
      type: object
      required: [score, level, sampleSize]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        level: { type: string, enum: [HIGH, MEDIUM, LOW, UNKNOWN] }
        sampleSize: { type: integer, minimum: 0 }
    DataQuality:
      type: object
      required: [freshness, dataState, liveVehicle, observedAt, providerDisplayName]
      properties:
        freshness: { $ref: '#/components/schemas/Freshness' }
        dataState: { $ref: '#/components/schemas/DataState' }
        liveVehicle: { type: boolean }
        observedAt: { type: string, format: date-time, nullable: true }
        providerDisplayName: { type: string, nullable: true, example: null }
        sourceAuthorized: { type: boolean, default: false }
    ActiveJourney:
      type: object
      required: [id, optionId, status, dataState, currentLegIndex]
      properties:
        id: { type: string, format: uuid }
        optionId: { type: string, format: uuid }
        status: { type: string, enum: [PLANNED, ACTIVE, COMPLETED, CANCELLED, ABANDONED] }
        currentLegIndex: { type: integer, minimum: 0 }
        eta: { $ref: '#/components/schemas/ETAEstimate' }
        dataState: { $ref: '#/components/schemas/DataState' }
        events:
          type: array
          items: { $ref: '#/components/schemas/JourneyEvent' }
    JourneyEvent:
      type: object
      required: [id, type, occurredAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        occurredAt: { type: string, format: date-time }
        details: { type: object, additionalProperties: true }
    JourneyProgressRequest:
      type: object
      additionalProperties: false
      properties:
        currentLegIndex: { type: integer, minimum: 0 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        occurredAt: { type: string, format: date-time }
    CommuteProfile:
      type: object
      required: [id, name, origin, destination, weekdays, targetArrival, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        origin: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/GeoPoint' }
        weekdays:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1, maximum: 7 }
        targetArrival: { type: string, format: time }
        enabled: { type: boolean }
    CommuteProfileInput:
      type: object
      required: [name, origin, destination, weekdays, targetArrival]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        origin: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/GeoPoint' }
        weekdays:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1, maximum: 7 }
        targetArrival: { type: string, format: time }
    LeaveAlert:
      type: object
      required: [id, scheduledFor, status]
      properties:
        id: { type: string, format: uuid }
        scheduledFor: { type: string, format: date-time }
        status: { type: string, enum: [SCHEDULED, SENT, CANCELLED, FAILED] }
    LeaveAlertInput:
      type: object
      required: [scheduledFor]
      properties:
        commuteProfileId: { type: string, format: uuid, nullable: true }
        journeyPlanId: { type: string, format: uuid, nullable: true }
        scheduledFor: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, type, title, body, isRead, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    PaginatedNotifications:
      type: object
      required: [items, page, pageSize, total, hasNext]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        hasNext: { type: boolean }
    User:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        createdAt: { type: string, format: date-time }
    UserPreferences:
      type: object
      properties:
        language: { type: string, example: es }
        defaultPreference: { type: string, enum: [BALANCED, FASTEST, LESS_WALKING, FEWER_TRANSFERS, RELIABLE] }
        maxWalkMin: { type: integer, minimum: 1, maximum: 60 }
        extraSafetyMarginMin: { type: integer, minimum: 0, maximum: 60 }
        locationConsent: { type: boolean }
    DeviceInstallation:
      type: object
      required: [id, installationId, platform, active]
      properties:
        id: { type: string, format: uuid }
        installationId: { type: string }
        platform: { type: string, enum: [IOS, ANDROID] }
        appVersion: { type: string }
        active: { type: boolean }
        lastSeenAt: { type: string, format: date-time, nullable: true }
    DeviceInstallationInput:
      type: object
      required: [installationId, platform, pushToken]
      properties:
        installationId: { type: string, minLength: 1, maxLength: 160 }
        platform: { type: string, enum: [IOS, ANDROID] }
        pushToken: { type: string, minLength: 1, writeOnly: true }
        appVersion: { type: string, maxLength: 40 }
    GuestMigrationRequest:
      type: object
      required: [clientDataVersion, items]
      properties:
        clientDataVersion: { type: string }
        items:
          type: array
          items: { type: object, additionalProperties: true }
    GuestMigrationResponse:
      type: object
      required: [migrationId, importedCount, skippedCount, idempotentReplay]
      properties:
        migrationId: { type: string, format: uuid }
        importedCount: { type: integer, minimum: 0 }
        skippedCount: { type: integer, minimum: 0 }
        idempotentReplay: { type: boolean }
    DataExportRequest:
      type: object
      required: [id, status, requestedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, PROCESSING, READY, EXPIRED, FAILED] }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
    ProviderHealthSnapshot:
      type: object
      required: [provider, capability, status, checkedAt]
      properties:
        provider: { type: string, example: authorized-transit-provider }
        capability: { type: string, example: planning }
        status: { type: string, enum: [HEALTHY, DEGRADED, UNAVAILABLE] }
        latencyMs: { type: integer, minimum: 0, nullable: true }
        checkedAt: { type: string, format: date-time }
    CommunityReport:
      type: object
      required: [id, type, status, location]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status: { type: string, enum: [ACTIVE, CONFIRMED, RESOLVED, EXPIRED, REJECTED] }
        location: { $ref: '#/components/schemas/GeoPoint' }
    CommunityReportInput:
      type: object
      required: [type, location]
      properties:
        type: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        details: { type: object, additionalProperties: true }
    Error:
      type: object
      required: [code, message, details, traceId]
      properties:
        code:
          type: string
          example: PROVIDER_TIMEOUT
        message:
          type: string
          example: No fue posible obtener una planificación actualizada.
        details:
          type: object
          additionalProperties: true
          example: { dataState: DEGRADED, retryable: true }
        traceId:
          type: string
          example: 6f36f44f-5d68-4e37-9074-2a5f9a1e6cf4
